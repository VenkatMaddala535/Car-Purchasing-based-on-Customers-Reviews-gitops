apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: car-project
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/VenkatMaddala535/Car-Purchasing-based-on-Customers-Reviews-gitops.git
    targetRevision: main
    path: .
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true 
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

