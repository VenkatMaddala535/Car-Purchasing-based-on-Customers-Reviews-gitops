apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: car-project-ingress
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - pipeline.d2.com
      secretName: my-tls-secret
  rules:
    - host: pipeline.d2.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: car-project-service
                port:
                  number: 8000
